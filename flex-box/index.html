<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex box</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      .container {
        border: 1px solid green;
        display: flex;
        flex-direction: row;
        justify-content: center;
        background-color: rgb(214, 212, 212);
        gap: 10px;
      }
      .cards {
        border: 1px solid orange;
        height: 400px;
        width: 300px;
        background-color: orange;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
      <div class="cards"></div>
    </div>
  </body>
</html>
